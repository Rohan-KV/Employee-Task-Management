<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - Task Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='edit_task.css') }}">
</head>
<body>
    <div class="form-page">
        <div class="form-card">
        <h1>Edit Task #{{ task['id'] }}</h1>
        
        <form action="{{ url_for('edit_task', task_id=task['id']) }}" method="post">
            <p>
                <label>Title</label>
                <input type="text" name="title" value="{{ task['title'] }}" required>
            </p>
            <p>
                <label>Description</label>
                <textarea name="description" rows="4">{{ task['description'] or '' }}</textarea>
            </p>
            <p>
                <label>Assign to</label>
                <select name="assigned_to">
                    <option value="">-- Unassigned --</option>
                    {% for employee in employees %}
                    <option value="{{ employee['id'] }}" {% if task['assigned_to'] == employee['id'] %}selected{% endif %}>{{ employee['username'] }}</option>
                    {% endfor %}
                </select>
            </p>
            <p class="form-actions">
                <button type="submit">Update Task</button>
                <a href="{{ url_for('dashboard') }}" class="secondary-link">Cancel</a>
            </p>
        </form>
        </div>
    </div>
</body>
</html>
