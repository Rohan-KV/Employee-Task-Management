<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task - Task Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='create_task.css') }}">
</head>
<body>
    <div class="form-page">
        <div class="form-card">
        <h1>Create New Task</h1>
        
        <form action="{{ url_for('create_task') }}" method="post">
            <p>
                <label>Title</label>
                <input type="text" name="title" required>
            </p>
            <p>
                <label>Description</label>
                <textarea name="description" rows="4"></textarea>
            </p>
            <p>
                <label>Assign to</label>
                <select name="assigned_to">
                    <option value="">-- Unassigned --</option>
                    {% for employee in employees %}
                    <option value="{{ employee['id'] }}">{{ employee['username'] }}</option>
                    {% endfor %}
                </select>
            </p>
            <p class="form-actions">
                <button type="submit">Create Task</button>
                <a href="{{ url_for('dashboard') }}" class="secondary-link">Cancel</a>
            </p>
        </form>
        </div>
    </div>
</body>
</html>
