<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users - Task Management</title>
</head>
<body>
    <div>
        <div>
            <h1>All Users</h1>
            <div>
                <a href="{{ url_for('add_user') }}">Add New User</a> |
                <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
            </div>
        </div>

        {% if users %}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user['id'] }}</td>
                    <td>{{ user['username'] }}</td>
                    <td>{{ user['role'] }}</td>
                    <td>
                        {% if user['username'] != 'admin' %}
                        <form action="{{ url_for('delete_user', user_id=user['id']) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this user?');">
                            <button type="submit">Delete</button>
                        </form>
                        {% else %}
                        <span>Cannot delete</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p>No users found.</p>
        {% endif %}
    </div>
</body>
</html>
