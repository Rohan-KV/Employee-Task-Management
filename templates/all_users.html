<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users - Task Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='all_users.css') }}">
</head>
<body>
    <div class="page-shell">
        <div class="topbar">
            <h1>All Users</h1>
            <div class="nav-links">
                <a href="{{ url_for('add_user') }}" class="link-button">Add New User</a>
                <a href="{{ url_for('dashboard') }}" class="link-button">Back to Dashboard</a>
            </div>
        </div>

        {% if users %}
        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user['id'] }}</td>
                    <td>{{ user['username'] }}</td>
                    <td><span class="role-badge role-{{ user['role'] }}">{{ user['role'] }}</span></td>
                    <td class="actions">
                        {% if user['username'] != 'admin' %}
                        <form action="{{ url_for('delete_user', user_id=user['id']) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this user?');">
                            <button type="submit">Delete</button>
                        </form>
                        {% else %}
                        <span>Cannot delete</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        </div>
        {% else %}
        <p class="empty-state">No users found.</p>
        {% endif %}
    </div>
</body>
</html>
